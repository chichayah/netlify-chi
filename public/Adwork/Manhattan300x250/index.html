	<script>
    //--------------preload-img-------------------
    function preload(arr,f) { $('<div id="preload" />').appendTo('body'); $(arr).each(function () {$('<img />').attr('src',this).appendTo('#preload').hide(); }); window.onload =function(){ f(); $('#preload').remove()} }
    //--------------vars-------------------
    var tl = gsap.timeline();
    var tlHandWrite = gsap.timeline({paused: true});
    var tlSequence = gsap.timeline();
    var tlMovements = gsap.timeline();
    //---------------------------------
    preload([
        "balloon1.png",
        "banner1.png",
        "banner2.png",
        "bg-back.png",
        "bg-front1.png",
        "bg-front2.png",
        "bg-mid.png",
        "bg-sky.jpg",
        "et-dash-ds.png",
        "et-dash.png",
        "et-dot-ds.png",
        "et-dot.png",
        "et-ds.png",
        "et.png",
        "snow.png",
        "sprite.png",
        "seq-boy.png",
        "seq-couple.png",
        "seq-cyclist-boy.png",
        "seq-cyclist-girl.png",
        "seq-father-son-walking.png",
        "seq-father-son.png",
        "seq-girl-bag.png",
        "seq-skater-boy.png",
        "seq-skater-girl.png"
    ],startAnim);
    //--------------animations---------------------
    function startAnim() {
        //--------------- SET -----------------
		gsap.set('#container', {display: 'block'});
        gsap.set('.balloon', {transformOrigin: '50% 20%'});
        gsap.set('.seq-boy, .seq-couple, .seq-father-son, .seq-girl-bag, .seq-skater-boy', {scale: 0.28});
        gsap.set('.seq-skater-girl', {scaleX: -0.3, scaleY: .25});
        gsap.set('.bystanders', {scale: 0.25});
        gsap.set('.seq-father-son-walking', {scale: 0.25});
        gsap.set('.car1,.car2', {scale: 0.23});
        gsap.set('.seq-cyclist-boy, .seq-cyclist-girl, .seq-father-son-walking', {scale: 0.25});
        //------------ ADD EVENT --------------
        addEvent();
        baloonAnim();
        //---------- ADD ANIMATION ------------
        tl
            //=========================
            .add('Scene1')
            .to(tlHandWrite, {duration: 2.5, progress: 1, ease: 'power1.out'}, 'Scene1')
            .to('.cta-arrow2',{duration:.3,opacity:1, yoyo: true, repeat: 3 }, 'Scene1+=3.0')
            .add(hoverFunction, 'Scene1+=3')
            .add(removeSnow, 'Scene1+=15')
            .add(function(){tlSequence.pause()}, 'Scene1+=15')

        tlHandWrite
            .add('write')
            .from('#draw-e', {duration: .5, drawSVG: '0%', ease: 'none'})
            .from('#draw-v', {duration: .4, drawSVG: '0%', ease: 'none'})
            .from('#draw-erything', {duration: 1.6, drawSVG: '0%', ease: 'none'})
            .from('.dash', {duration: .2, width: 0, ease: 'none'})
            .from('.dot', {duration: .1, opacity: 0, ease: 'none'})
        
        tlMovements
            .add('move')
            .to('.seq-boy', {duration: 15, x: -70, ease: 'none'}, 'move')
            .to('.seq-girl-bag', {duration: 15, x: -40, ease: 'none'}, 'move')
            .to('.seq-couple', {duration: 15, x: -60, ease: 'none'}, 'move')
            .to('.seq-father-son-walking', {duration: 15, x: -60, ease: 'none'}, 'move')
            .to('.car1', {duration: 15, x: -500, ease: 'power1.in'}, 'move')
            .to('.car2', {duration: 15, x: -500, ease: 'none'}, 'move')
            .to('.seq-cyclist-boy', {duration: 15, x:  160, ease: 'none'}, 'move')
            .to('.seq-cyclist-girl', {duration: 15, x:  130, ease: 'none'}, 'move')
            .to('.seq-skater-boy', {duration: 15, x: 20, ease: 'none'}, 'move')
            .to('.seq-skater-girl', {duration: 15, x: 51, ease: 'none'}, 'move')

        tlSequence
            .add('seq')
            .to('.seq-boy',{duration: 1.2, ease:SteppedEase.config(43), backgroundPosition:'0px -3440px', repeat: -1}, 'seq')
            .to('.seq-girl-bag',{duration: 1.0, ease:SteppedEase.config(8), backgroundPosition:'0px -720px', repeat: -1}, 'seq')
            .to('.seq-couple',{duration: 1.4, ease:SteppedEase.config(13), backgroundPosition:'-1430px 0px', repeat: -1}, 'seq')
            .to('.seq-father-son',{duration: 1, ease:SteppedEase.config(13), backgroundPosition:'0px -1092px', repeat: -1}, 'seq')
            .to('.seq-father-son-walking',{duration: 1.6, ease:SteppedEase.config(10), backgroundPosition:'0px -900px', repeat: -1}, 'seq')
            .to('.seq-cyclist-boy',{duration: 1, ease:SteppedEase.config(8), backgroundPosition:'0px -688px', repeat: -1}, 'seq')
            .to('.seq-cyclist-girl',{duration: 1, ease:SteppedEase.config(6), backgroundPosition:'0px -480px', repeat: -1}, 'seq')

            .to('.seq-skater-girl',{duration: 2, ease:SteppedEase.config(13), backgroundPosition:'0px -910px', yoyo: true, repeat: -1}, 'seq')

    };


    function baloonAnim() {
        gsap.fromTo('.balloon1', {rotation:  4}, {duration: 4, rotation: -4, yoyo: true, repeat: 3, ease: 'power1.inOut'});
        gsap.fromTo('.balloon1 img', {y: -2}, {duration: 3, y: 2, yoyo: true, repeat: 4, ease: 'power1.inOut'});
    }

    function addEvent() {
        $('#clickthru').on('click', exit);
    };
    
    function exit() {
        //-----------exit guide--------------------------
        //--adword--> ExitApi.exit();
        //--adgear--> ADGEAR.html5.clickThrough("clickTAG");
        //--studio--> Enabler.exit('Background Exit'); 
        //--standard/sizemek/adword no-api--> window.open(clickTag);
        //-----------exit--------------------------------
        window.open(clickTag); /*Studio/Enabler Exit*/
    }
    
    function hoverFunction() {
        $('#clickthru').on('mouseenter', function() {
            gsap.to('.cta-arrow1',{duration:.3,opacity:0});
            gsap.to('.cta-arrow2',{duration:.3,opacity:1 });
        });
        $('#clickthru').on('mouseleave', function() {
            gsap.to('.cta-arrow1',{duration:.3,opacity:1});
            gsap.to('.cta-arrow2',{duration:.3,opacity:0});
        });
    }
