	<script>
	var assets,manifest,scripts;
    //platforms = Standard / Adgear / Adwords / Sizmek = Standard / Studio
//    var platform = 'Standard';
//    switch(platform){
//        case 'Studio':
//            scripts = 'https://s0.2mdn.net/ads/studio/Enabler.js';
//        break;
//        case 'Adgear':
//            scripts = 'https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js';
//        break;
//        case 'Adwords':
//            scripts = 'https://tpc.googlesyndication.com/pagead/gadgets/html5/api/exitapi.js';
//        break;
//        default:break;
//    }
    //--------------preload---------------------
    
    function preloadfiles(){
        assets = new createjs.LoadQueue(false);
        manifest=[
            {src: 'sprite.png'},
            {src: 'truck.png'},
            {src: 'truckstar-1.png'},
            {src: 'truckstar-2.png'},
            {src: 'truckstar-3.png'}
        ];
        if(scripts) manifest.push({src:scripts}); 
        assets.loadManifest(manifest);
        assets.on('complete',function(){
            if(scripts){
                var js = document.createElement('script');
                js.src = scripts;
            }
            startAnim();
        });

    }
    window.onload = preloadfiles();
    //--------------animations---------------------
    var tl = gsap.timeline({defaults: {duration: 2, ease: "power4.inOut" }});
    var tlMorph = gsap.timeline();
    function startAnim() {
        //--------------- SET -----------------
        gsap.set('#container', {display: 'block'});
        gsap.set('svg', {rotation: 0.001, force3D: true});
        gsap.set('.imgfix', {rotation: 0.001, force3D: true});
        gsap.set('.sprite', {rotation: 0.001, force3D: true});
        //------------ ADD EVENT --------------
        addEvent();
        hoverFunction();
        //---------- ADD ANIMATION ------------
        tl
            //=========================
            .add('Scene1')
            .from('.t1', { x: -450},'Scene1')
            .from('.truck', { x: -450 },'Scene1+=.1')
            .from('.star', { stagger: .1, duration: 1, scale: 0, opacity: 0, ease: "back.out(1.7)", repeat: 3, yoyo: true},'Scene1+=1.6')
        
            .add('Scene2','-=1')
            .to('.t1', { x: 450 },'Scene2')
            .to('.truck-holder', { x: 450 },'Scene2')
            .from('.t2', { x: -450},'Scene2+=.1')
        
            .add('Scene3','+=2')
            .to('.t2', { x: 450 },'Scene3')
            .from('.t3', { stagger: .2, x: -450 },'Scene3+=.1')
        
            .add('Scene4','+=2')
            .to('.t3', { x: 450 },'Scene4')
            .from('.t4a', { x: -450 },'Scene4+=.1')
            .from('.t4b', { x: -450 },'Scene4+=.3')
            .to('.cta-arrow', {duration:0.3, x:5, yoyo:true, repeat:3, ease: "power1.inOut"})
        
        tlMorph
            //=========================
            .to("#purplepath1", {duration: 5, morphSVG: "#purplepath2", yoyo: true, repeat: 3, yoyo: true, ease: 'none'}, 0)
            .to("#redpath1", {duration: 5, morphSVG: "#redpath2", yoyo: true, repeat: 3, yoyo: true, ease: 'none'}, 0)
        //-------------------------------------
    };
    function addEvent() {
        $('#clickthru').on('click', exit);
    };
    
    function exit() {
        //-----------exit guide--------------------------
        //--adword--> ExitApi.exit();
        //--adgear--> ADGEAR.html5.clickThrough('clickTAG');
        //--studio--> Enabler.exit('Background Exit'); 
        //--standard/sizemek/adword no-api--> window.open(clickTag);
        //-----------exit--------------------------------
        window.open(clickTag);
    }
    
    function hoverFunction() {
        $('#clickthru').on('mouseenter', function() {

            gsap.to('.cta-arrow', {duration:0.3, x:5, yoyo:true, repeat:3, ease: "power1.inOut"})
        });
        $('#clickthru').on('mouseleave', function() {
        });
    }
//-------------------------------------

</script>
